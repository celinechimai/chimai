# Deploys the main branch to chimai.ca over SSH.
name: Deploy chimai.ca

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-chimai
  cancel-in-progress: true

env:
  # Remote directory on Hostinger, relative to the SSH user's home.
  # chimai.ca is set up as an addon domain, so its web root is
  # "domains/chimai.ca/public_html". If it were the account's primary
  # domain, this would be "public_html" instead.
  REMOTE_DIR: domains/chimai.ca/public_html

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://chimai.ca
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync openssh-client

      - name: Deploy to Hostinger over SSH
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USERNAME }}
          SSH_PASS: ${{ secrets.NAME_PASSWORD }}
        run: |
          set -euo pipefail

          # Trust the server's host key so the connection isn't vulnerable
          # to man-in-the-middle on first connect.
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

          # Sync the repo to the remote web root, deleting files that were
          # removed from the repo. Secrets are masked in logs by GitHub.
          sshpass -p "$SSH_PASS" rsync -avz --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/node_modules/' \
            -e "ssh -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"
