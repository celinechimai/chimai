<!DOCTYPE html>
<html lang="en">
<head>

<title>Chi Mai</title>

<link rel="stylesheet" href="styles.css">

<!-- ======================= SCREEN 1 : HERO ======================= -->
<header class="screen screen-hero">

    <span class="wordmark">CHI&nbsp;MAI</span>

      <a href="https://www.linkedin.com/in/celinechimai/" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
          <rect x="2" y="9" width="4" height="12"/>
          <circle cx="4" cy="4" r="2"/>
        </svg>
      </a>
      <a href="https://www.instagram.com/chimai0403/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/>
        </svg>
      </a>

  <div class="hero">
    <div class="hero-copy">
      <h1>Hi, I&rsquo;m Chi.</h1>
      <p class="hero-line">I elevate customer experience, sell softwares and build products.</p>
    </div>
    <div class="hero-photo">
      <img src="assets/chi-portrait.jpg" alt="Portrait of Chi Mai">
    </div>
  </div>
</header>

<!-- ======================= SCREEN 2 : PRODUCTS + EXPERIENCE ======================= -->
<main class="screen screen-main">

  <section class="products">

    <!-- Card 1 : WellFinder -->

      <img class="card-logo" src="assets/wellfinder-logo.png" alt="WellFinder">

      <div class="shots">
        <img src="assets/wellfinder-1.jpg" alt="WellFinder — discover treatments">
        <img src="assets/wellfinder-2.jpg" alt="WellFinder — swipe providers">

      <a class="cta" href="https://wellfinder.ca" target="_blank" rel="noopener">Explore WellFinder</a>
    </article>

    <!-- Card 2 : Pounc -->
    <article class="card">
      <span class="card-wordmark">Pounc</span>
      <p class="card-desc">Scroll into new skills and hobbies</p>
      <div class="shots">
        <img src="assets/pounc-1.jpg" alt="Pounc — explore">
        <img src="assets/pounc-2.jpg" alt="Pounc — tennis library">
        <img src="assets/pounc-3.jpg" alt="Pounc — video viewer">
      </div>
      <a class="cta" href="https://pounc.chimai.ca" target="_blank" rel="noopener">Explore Pounc</a>

  <section class="experience">
    <h2 class="section-title">Places I&rsquo;ve worked at</h2>

      <div class="marquee-track">
        <img src="assets/logos/procore.jpg" alt="">

        <img src="assets/logos/louis-vuitton.svg" alt="">
        <img src="assets/logos/four-seasons.svg" alt="">
        <img src="assets/logos/holt-renfrew.svg" alt="">
        <img src="assets/logos/peloton.svg" alt="">

        <img src="assets/logos/procore.jpg" alt="">
        <img src="assets/logos/coveo.png" alt="">
        <img src="assets/logos/shopee.svg" alt="">
        <img src="assets/logos/niq.svg" alt="">
        <img src="assets/logos/louis-vuitton.svg" alt="">
        <img src="assets/logos/four-seasons.svg" alt="">
        <img src="assets/logos/holt-renfrew.svg" alt="">
        <img src="assets/logos/peloton.svg" alt="">
      </div>
    </div>

  <footer>
    <span class="wordmark">CHI&nbsp;MAI</span>
  </footer>
